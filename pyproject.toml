[project]
name = "receptionist"
version = "0.1.0"
description = "AI voice receptionist for diagnostic labs"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai]~=1.8",
    "livekit-api",
    "langchain",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receptionist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
